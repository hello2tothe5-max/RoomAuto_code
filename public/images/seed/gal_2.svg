<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(200,70%,82%)"/>
      <stop offset="100%" stop-color="hsl(240,70%,62%)"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#g)"/>
  <!-- 바닥 -->
  <polygon points="0,420 800,420 800,600 0,600" fill="hsl(200,45%,75%)" opacity="0.55"/>
  <!-- 벽(소파 모양 느낌) -->
  <rect x="120" y="300" width="560" height="90" rx="10" fill="rgba(255,255,255,0.55)"/>
  <rect x="160" y="330" width="480" height="60" rx="8" fill="rgba(255,255,255,0.35)"/>
  <!-- 창문 -->
  <rect x="330" y="150" width="140" height="120" rx="6" fill="rgba(255,255,255,0.7)"/>
  <line x1="400" y1="150" x2="400" y2="270" stroke="rgba(120,120,120,0.5)" stroke-width="4"/>
  <!-- 화분 -->
  <circle cx="640" cy="330" r="30" fill="rgba(80,150,90,0.6)"/>
  <rect x="625" y="340" width="30" height="40" rx="4" fill="rgba(160,110,70,0.8)"/>
  <text x="400" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="rgba(255,255,255,0.9)" font-weight="bold">북유럽 침실</text>
  <text x="400" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.8)">침실 · 북유럽</text>
</svg>