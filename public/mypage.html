<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마이 페이지 - RoomAuto</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/mypage.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>

<body>

  <!-- ==================== 상단 내비게이션 ==================== -->
  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo">
        <img src="./images/roomauto-logo-navbar.png" alt="RoomAuto 로고" class="logo-mark">
        <span class="logo-sub">RoomAuto</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">홈</a></li>
        <li><a href="design.html">AI 디자인</a></li>
        <li><a href="gallery.html">갤러리</a></li>
        <li><a href="reviews.html">사용자 리뷰</a></li>
      </ul>
      <div class="nav-right">
        <a class="btn btn-ghost btn-sm" href="login.html" id="start-btn">시작하기</a>
      </div>
      <button class="nav-toggle" aria-label="메뉴 열기">☰</button>
    </div>
  </nav>

  <!-- ==================== 본문 ==================== -->
  <main class="page-main">
    <div id="mypage-main-view">
      <!-- 빵 부스러기 및 페이지 타이틀 -->
      <div class="mp-page-header">
        <nav class="breadcrumb">
          <a href="index.html">홈</a><span class="sep">›</span>
          <a href="mypage.html">마이 페이지</a>
        </nav>
        <h1 class="mp-main-title">마이페이지</h1>
      </div>
      <div class="mypage-layout">

        <!-- 1. 아바타(프로필) 박스 -->
        <div class="mp-profile-box">
          <div class="mp-avatar">
            <img src="./images/mypage.png" alt="프로필">
          </div>
          <h2 class="mp-username" id="displayUsername">유저 이름</h2>
          <button class="mp-logout-btn" id="mpLogoutBtn">로그아웃</button>
          <button class="mp-delete-btn" id="deleteBtn">회원 탈퇴</button>
        </div>
        <!-- 2. 나의 디자인 카드 -->
        <div id="mydesigns-card" class="mp-design-card" style="background-image: url('./images/seed/gal_4.jpeg');">
          <div class="mp-card-overlay">
            <div class="mp-card-icon"><img src="./images/album.png" alt="아이콘"></div>
            <h2 class="mp-card-title">나의 디자인</h2>
          </div>
        </div>
        <!-- 3. 좋아요 한 디자인 카드 -->
        <div id="card-likes" class="mp-design-card" style="background-image: url('./images/seed/gal_1.jpeg');">
          <div class="mp-card-overlay">
            <div class="mp-card-icon"><img src="./images/album.png" alt="아이콘"></div>
            <h2 class="mp-card-title">좋아요 한 디자인</h2>
          </div>
        </div>
        <!-- 4. 북마크 한 디자인 카드 -->
        <div id="card-bookmarks" class="mp-design-card" style="background-image: url('./images/seed/gal_2.jpg');">
          <div class="mp-card-overlay">
            <div class="mp-card-icon"><img src="./images/album.png" alt="아이콘"></div>
            <h2 class="mp-card-title">북마크 한 디자인</h2>
          </div>
        </div>
      </div>
    </div>
    <!-- 카드를 클릭하면 나타나는 갤러리 화면 (기본은 숨김 처리) -->
    <div id="mypage-sub-view" style="display: none; max-width: 1920px; margin: 0 auto; padding: 40px 5vw 120px;">
      <!-- 상단 빵부스러기 & 제목 -->
      <div id="sub-view-header">
        <!-- 자바스크립트로 채워집니다 -->
      </div>
      <!-- 2단 갤러리 이미지 그리드 -->
      <div id="sub-view-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 40px;">
        <!-- 자바스크립트로 채워집니다 -->
      </div>
    </div>


  </main>

  <!-- ==================== 푸터 ==================== -->
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-top">
        <div class="footer-brand">
          <a href="index.html" style="display: flex; align-items: center; text-decoration: none;">
            <img src="./images/roomauto-logo-footer.png" alt="RoomAuto 푸터 로고" class="footer-logo">
            <strong class="footer-name">RoomAuto</strong>
          </a>
        </div>
        <div class="footer-links">
          <a href="personal.html">개인정보처리방침</a>
          <a href="promise.html">웹사이트 이용약관</a>
        </div>
      </div>
      <div class="footer-bottom">
        <p>© 2026 RoomAuto(KLHYK). All Right Reserved</p>
      </div>
    </div>
  </footer>
  <!-- ==================== 로그인 모달 ==================== -->
  <div id="login-modal" class="modal-overlay">
    <div class="modal-content">
      <button id="close-modal-btn" class="close-btn">&times;</button>
      <h1 style="font-size: 24px; color: var(--ink);">안녕하세요</h1>
      <p style="color: var(--primary-mid); font-size: 20px; margin-top: 10px; margin-bottom: 12px;">
        간단한 회원가입으로 인테리어 추천 받기
      </p>
      <div style="display: flex; flex-direction: column; gap: 20px; max-width: 300px; margin: 0 auto;">
        <a class="social-btn" href="/auth/google">
          <img src="./images/flat-color-icons_google.png" width="24px" height="24px"> 구글 로그인
        </a>
        <a class="social-btn" href="/auth/github">
          <img src="./images/github.png" width="24px" height="24px"> 깃허브 로그인
        </a>
      </div>
    </div>
  </div>
  <!-- 회원 탈퇴 확인 모달 -->
  <div id="deleteModalOverlay" class="mp-modal-overlay">
    <div class="mp-modal-box">
      <h2 class="mp-modal-title">정말 탈퇴하시겠습니까?</h2>
      <p class="mp-modal-desc">탈퇴 후에는 정보를 복구하실 수 없습니다.</p>
      <div class="mp-modal-actions">
        <button id="btnDeleteYes" class="mp-modal-btn outline">네</button>
        <button id="btnDeleteNo" class="mp-modal-btn solid">아니오</button>
      </div>
    </div>
  </div>
  <script src="/js/common.js"></script>
  <script src="/js/mypage.js"></script>
</body>

</html>
