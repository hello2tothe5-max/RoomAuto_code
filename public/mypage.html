<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마이 페이지 - RoomAuto</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/mypage.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>

<body>

  <!-- ==================== 상단 내비게이션 ==================== -->
  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo">
        <img src="./images/roomauto-logo-navbar.png" alt="RoomAuto 로고" class="logo-mark">
        <span class="logo-sub">RoomAuto</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">홈</a></li>
        <li><a href="design.html">AI 디자인</a></li>
        <li><a href="gallery.html">갤러리</a></li>
        <li><a href="reviews.html">사용자 리뷰</a></li>
      </ul>
      <div class="nav-right">
        <a class="btn btn-ghost btn-sm" href="login.html" id="start-btn">시작하기</a>
      </div>
      <button class="nav-toggle" aria-label="메뉴 열기">☰</button>
    </div>
  </nav>

  <!-- ==================== 본문 ==================== -->
  <main class="page-main">
    <div class="container">

      <!-- 빵 부스러기 -->
      <nav class="breadcrumb">
        <a href="index.html">홈</a><span class="sep">›</span>
        <span>마이 페이지</span>
      </nav>

      <!-- 프로필 카드 -->
      <div class="profile-card fade-up" id="profileCard">
        <div class="loading-box" style="color:#fff;">
          <div class="spinner"></div>
        </div>
      </div>

      <!-- 탭 -->
      <div class="mp-tabs fade-up">
        <button class="mp-tab active" data-panel="history">나의 생성 내역</button>
        <button class="mp-tab" data-panel="likes">좋아요</button>
        <button class="mp-tab" data-panel="bookmarks">북마크</button>
        <button class="mp-tab" data-panel="settings">설정</button>
      </div>

      <!-- 나의 생성 내역 탭 -->
      <div class="mp-panel active" id="panel-history">
        <div class="loading-box">
          <div class="spinner"></div>
        </div>
      </div>

      <!-- 좋아요 탭 -->
      <div class="mp-panel" id="panel-likes">
        <div class="loading-box">
          <div class="spinner"></div>
        </div>
      </div>

      <!-- 북마크 탭 -->
      <div class="mp-panel" id="panel-bookmarks">
        <div class="loading-box">
          <div class="spinner"></div>
        </div>
      </div>

      <!-- 설정 탭 -->
      <div class="mp-panel" id="panel-settings">
        <div class="settings-card">
          <h3>회원 정보 수정</h3>
          <div class="form-field">
            <label for="editNickname">닉네임</label>
            <input class="input" id="editNickname" type="text">
          </div>
          <div class="form-field">
            <label for="editEmail">이메일</label>
            <input class="input" id="editEmail" type="email">
          </div>
          <p class="form-error" id="editError"></p>
          <button class="btn btn-primary" id="saveProfileBtn">수정 저장</button>
        </div>

        <div class="settings-card">
          <h3>비밀번호 변경</h3>
          <div class="form-field">
            <label for="pwCurrent">현재 비밀번호</label>
            <input class="input" id="pwCurrent" type="password">
          </div>
          <div class="form-field">
            <label for="pwNext">새 비밀번호 (4자리 이상)</label>
            <input class="input" id="pwNext" type="password">
          </div>
          <div class="form-field">
            <label for="pwNext2">새 비밀번호 확인</label>
            <input class="input" id="pwNext2" type="password">
          </div>
          <p class="form-error" id="pwError"></p>
          <button class="btn btn-primary" id="changePwBtn">비밀번호 변경</button>
        </div>

        <div class="danger-zone">
          <h3>회원 탈퇴</h3>
          <p>탈퇴하면 좋아요와 북마크 기록이 모두 삭제되고 복구할 수 없어요.</p>
          <div class="form-field">
            <label for="delPassword">비밀번호 입력</label>
            <input class="input" id="delPassword" type="password" placeholder="소셜 로그인 회원은 비워도 돼요">
          </div>
          <p class="form-error" id="delError"></p>
          <button class="btn btn-danger" id="deleteBtn">회원 탈퇴하기</button>
        </div>
      </div>
    </div>
  </main>

  <!-- ==================== 푸터 ==================== -->
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-top">
        <div class="footer-brand">
          <a href="index.html" style="display: flex; align-items: center; text-decoration: none;">
            <img src="./images/roomauto-logo-footer.png" alt="RoomAuto 푸터 로고" class="footer-logo">
            <strong class="footer-name">RoomAuto</strong>
          </a>
        </div>
        <div class="footer-links">
          <a href="personal.html">개인정보처리방침</a>
          <a href="promise.html">웹사이트 이용약관</a>
        </div>
      </div>
      <div class="footer-bottom">
        <p>© 2026 RoomAuto(KLHYK). All Right Reserved</p>
      </div>
    </div>
  </footer>
  <!-- ==================== 로그인 모달 ==================== -->
  <div id="login-modal" class="modal-overlay">
    <div class="modal-content">
      <button id="close-modal-btn" class="close-btn">&times;</button>
      <h1 style="font-size: 24px; color: var(--ink);">안녕하세요</h1>
      <p style="color: var(--primary-mid); font-size: 20px; margin-top: 10px; margin-bottom: 12px;">
        간단한 회원가입으로 인테리어 추천 받기
      </p>
      <div style="display: flex; flex-direction: column; gap: 20px; max-width: 300px; margin: 0 auto;">
        <a class="social-btn" href="/auth/google">
          <img src="./images/flat-color-icons_google.png" width="24px" height="24px"> 구글 로그인
        </a>
        <a class="social-btn" href="/auth/github">
          <img src="./images/github.png" width="24px" height="24px"> 깃허브 로그인
        </a>
      </div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/mypage.js"></script>
</body>

</html>
